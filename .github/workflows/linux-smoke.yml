name: Linux tests

on:
  push:
    branches: [main, claude/github-testing-windows-linux-06b9or]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run on the same ref when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install X11 automation + Tk system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool xclip imagemagick x11-utils \
            python3-tk tk

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create venv from the system Python (so tkinter is available)
        # Use the distro interpreter that python3-tk installs into, not a
        # hostedtoolcache python that may shadow it without _tkinter.
        run: uv venv --python /usr/bin/python3 .venv

      - name: Install kitchensearch into the venv from the working tree
        run: uv pip install --python .venv/bin/python .

      - name: Verify tkinter import inside the venv's Python
        run: |
          .venv/bin/python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Fast unit tests
        continue-on-error: true
        run: |
          .venv/bin/python -m unittest discover -s tests/fast -t .

      # Isolated input-layer check: drives a tiny Tk probe and verifies each
      # harness key() delivers the correct Tk key event. Diagnostic (non-gating)
      # so per-platform input differences surface without blocking the GIFs.
      - name: Key-command unit test
        continue-on-error: true
        run: |
          mkdir -p tests/test_run
          .venv/bin/python tests/key_test.py --json > tests/test_run/key-test.json || true
          .venv/bin/python tests/key_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-key-test
          path: |
            tests/test_run/key-test.json
            tests/test_run/key_test/
          if-no-files-found: warn

      # Each test self-wraps under xvfb-run; the per-test folder (with the GIF)
      # is uploaded as an artifact you can download from the run summary.
      - name: Run test_01_main_menu
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_01_main_menu
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_01_main_menu
          path: tests/test_run/test_01_main_menu/
          if-no-files-found: warn

      - name: Run test_02_keyword_search
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_02_keyword_search
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_02_keyword_search
          path: tests/test_run/test_02_keyword_search/
          if-no-files-found: warn

      - name: Run test_15_banner
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_15_banner
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_15_banner
          path: tests/test_run/test_15_banner/
          if-no-files-found: warn

      - name: Run test_16_story
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_16_story
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_16_story
          path: tests/test_run/test_16_story/
          if-no-files-found: warn

      - name: Run test_30_manyresults
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_30_manyresults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_30_manyresults
          path: tests/test_run/test_30_manyresults/
          if-no-files-found: warn

      - name: Run test_31_darkmode
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_31_darkmode
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_31_darkmode
          path: tests/test_run/test_31_darkmode/
          if-no-files-found: warn

      - name: Run test_32_settingtoggles
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_32_settingtoggles
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_32_settingtoggles
          path: tests/test_run/test_32_settingtoggles/
          if-no-files-found: warn

      # Prototype of the fast screen-state style (one image per stable screen,
      # synced on app readiness events — see tests/scripts/test_40_fast_keyword).
      # Non-gating while the approach is evaluated.
      - name: Run test_40_fast_keyword (prototype)
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/python tests/linux_run.py test_40_fast_keyword
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gif-test_40_fast_keyword
          path: tests/test_run/test_40_fast_keyword/
          if-no-files-found: warn

      # Pass condition: every step that should copy a combo image must have
      # copied the *same* image as the approved baseline. Runs after all tests
      # so it sees every per-step <step>_clipboard.png in tests/test_run.
      - name: Verify clipboard image copies match baseline
        if: always()
        # test_16_story's copied image is generated by the semantic-story model,
        # which isn't available in CI, so it can't be reproduced here.
        run: |
          .venv/bin/python tests/check_clipboard.py --all --skip test_16_story --run-dir tests/test_run --json \
            > tests/test_run/clipboard-check.json || true
          .venv/bin/python tests/check_clipboard.py --all --skip test_16_story --run-dir tests/test_run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clipboard-check
          path: tests/test_run/clipboard-check.json
          if-no-files-found: warn
