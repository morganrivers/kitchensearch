name: macOS tests

on:
  push:
    branches: [main, claude/github-testing-windows-linux-06b9or]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Open upterm SSH session before visual replay'
        type: boolean
        default: false

jobs:
  mac-tests:
    runs-on: macos-14            # arm64 Sonoma; macos-15 adds a weekly Screen Recording TCC prompt
    timeout-minutes: 30
    env:
      KITCHENSEARCH_BIN: kitchensearch
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install brew Python with Tk
        run: brew install python-tk@3.12

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install kitchensearch from working tree (use brew Python with Tk)
        run: uv tool install --python "$(brew --prefix)/bin/python3.12" .

      - name: Verify entry points exist
        run: |
          which kitchensearch
          which emoji_story
          which emoji_split_daemon

      - name: Resolve the tool's Python interpreter
        run: |
          TOOL_PY="$(uv tool dir)/kitchensearch/bin/python"
          test -x "$TOOL_PY"
          echo "TOOL_PY=$TOOL_PY" >> "$GITHUB_ENV"

      - name: Verify tkinter import inside the tool's Python
        run: |
          "$TOOL_PY" -c "import tkinter; print(tkinter.TkVersion)"

      - name: Smoke-launch the search daemon (also primes the model for the visual test)
        run: |
          emoji_split_daemon &
          echo $! > /tmp/daemon.pid
          sleep 12  # allow model load
          "$TOOL_PY" -c "
          import json, pathlib
          from multiprocessing.connection import Client
          from platformdirs import user_cache_dir
          sock_path = pathlib.Path(user_cache_dir('kitchensearch')) / 'split-daemon.sock'
          conn = Client(str(sock_path))
          conn.send_bytes(json.dumps({'query': 'cat', 'limit': 3}).encode())
          resp = json.loads(conn.recv_bytes().decode())
          conn.close()
          print(resp)
          assert isinstance(resp, list) and resp, 'expected non-empty JSON array'
          "

      - name: Fast unit tests
        run: |
          "$TOOL_PY" -m unittest discover -s tests/fast -t .

      # Isolated input-layer check: drives a tiny Tk probe and verifies each
      # harness key() delivers the correct Tk key event. Diagnostic (non-gating)
      # — this is what catches "F11" being typed as literal text on macOS.
      - name: Key-command unit test
        continue-on-error: true
        run: |
          mkdir -p tests/test_run
          "$TOOL_PY" tests/key_test.py --json > tests/test_run/key-test.json || true
          "$TOOL_PY" tests/key_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-key-test
          path: |
            tests/test_run/key-test.json
            tests/test_run/key_test/
          if-no-files-found: warn

      - name: Upterm (interactive) - only when manually triggered
        if: github.event_name == 'workflow_dispatch' && inputs.debug
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true

      - name: Run test_01_main_menu
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_01_main_menu'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_01_main_menu
          path: tests/test_run/test_01_main_menu/
          if-no-files-found: warn

      - name: Run test_02_keyword_search
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_02_keyword_search'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_02_keyword_search
          path: tests/test_run/test_02_keyword_search/
          if-no-files-found: warn

      - name: Run test_15_banner
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_15_banner'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_15_banner
          path: tests/test_run/test_15_banner/
          if-no-files-found: warn

      - name: Run test_16_story
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_16_story'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_16_story
          path: tests/test_run/test_16_story/
          if-no-files-found: warn

      - name: Run test_30_manyresults
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_30_manyresults'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_30_manyresults
          path: tests/test_run/test_30_manyresults/
          if-no-files-found: warn

      - name: Run test_31_darkmode
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_31_darkmode'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_31_darkmode
          path: tests/test_run/test_31_darkmode/
          if-no-files-found: warn

      - name: Run test_32_settingtoggles
        continue-on-error: true
        run: '"$TOOL_PY" tests/mac_run.py test_32_settingtoggles'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-test_32_settingtoggles
          path: tests/test_run/test_32_settingtoggles/
          if-no-files-found: warn

      # Pass condition: every step that should copy a combo image must have
      # copied the same image (verified by source-content hash, cross-platform).
      - name: Verify clipboard image copies match baseline
        if: always()
        # test_16_story's copied image is generated by the semantic-story model,
        # which isn't available in CI, so it can't be reproduced here.
        run: |
          "$TOOL_PY" tests/check_clipboard.py --all --skip test_16_story --run-dir tests/test_run --json > tests/test_run/clipboard-check.json || true
          "$TOOL_PY" tests/check_clipboard.py --all --skip test_16_story --run-dir tests/test_run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-clipboard-check
          path: tests/test_run/clipboard-check.json
          if-no-files-found: warn

      - name: Stop daemon
        if: always()
        run: |
          if [ -f /tmp/daemon.pid ]; then
            kill "$(cat /tmp/daemon.pid)" 2>/dev/null || true
          fi
